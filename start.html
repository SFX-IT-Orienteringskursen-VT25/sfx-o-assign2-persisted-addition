<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarna Coding Project</title>
</head>

<body>
    <div class="container">
        <h1>Add a Number and Summarize Them</h1>
        <p>Enter a number below. The calculator will correctly summarize the numbers.</p>
        <p><strong>Bonus improvement:</strong> Prevents invalid inputs. Numbers are persisted across page reloads.</p>

        <input type="text" id="numberInput" placeholder="Enter an integer">
        <button id="addButton">Add Number</button>
        <button id="clearButton">Clear All</button>

        <div class="list">
            <div id="numberList"></div>
            =
            <h3><span id="totalSum">0</span></h3>
        </div>
    </div>

    <!-- numberStore handles all read/write/sum logic -->
    <script src="numberStore.js"></script>
    <script>
        const store = createNumberStore(localStorage);

        const numberInput = document.getElementById('numberInput');
        const addButton = document.getElementById('addButton');
        const clearButton = document.getElementById('clearButton');
        const numberList = document.getElementById('numberList');
        const totalSum = document.getElementById('totalSum');

        function updateUI() {
            const numbers = store.getNumbers();
            numberList.textContent = numbers.length ? numbers.join(' + ') : '';
            totalSum.textContent = store.getSum();
        }

        // Restore persisted numbers on page load
        updateUI();

        addButton.addEventListener('click', function () {
            const number = numberInput.value.trim();

            if (!/^-?\d+$/.test(number)) {
                alert('Please enter a valid integer.');
                return;
            }

            store.addNumber(parseInt(number, 10));
            updateUI();

            numberInput.value = '';
            numberInput.focus();
        });

        clearButton.addEventListener('click', function () {
            store.clear();
            updateUI();
        });
    </script>
</body>

</html>
