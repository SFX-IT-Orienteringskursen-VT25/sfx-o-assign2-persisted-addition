<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add and Summarize Numbers</title>
</head>
<body>
    <div class="container">
        <h1>Add a Number and Summarize Them</h1>
        <p>Enter a number below. The calculator will correctly summarize the numbers.</p>
        <p><strong>Bonus improvement:</strong> Prevents adding invalid inputs.</p>
        
        <input type="text" id="numberInput" placeholder="Enter an integer">
        <button id="addButton">Add Number</button>
        
        <div class="list">
            <div id="numberList"></div>
            =
            <h3><span id="totalSum">0</span></h3>
        </div>
    </div>

    <script>
        const numberInput = document.getElementById('numberInput');
        const addButton = document.getElementById('addButton');
        const numberList = document.getElementById('numberList');
        const totalSum = document.getElementById('totalSum');

        // --- CORE LOGIC (Unified function for read/write + summarizing) ---
        function manageNumbersAndSummarize(action, newNumber = null) {
            // 1. READ from persistence layer
            const stored = localStorage.getItem('persistedNumbers');
            let numbers = stored ? JSON.parse(stored) : [];

            // 2. WRITE (if a new number is being added)
            if (action === 'ADD' && typeof newNumber === 'number' && !isNaN(newNumber)) {
                numbers.push(newNumber);
                localStorage.setItem('persistedNumbers', JSON.stringify(numbers));
            }

            // 3. SUMMARIZING LOGIC (Contained inside the same function)
            const sum = numbers.reduce((total, current) => total + current, 0);

            // Return both the updated array and the final summary
            return { numbers, sum };
        }

        // Function to refresh the UI elements
        function updateUI(data) {
            numberList.textContent = data.numbers.length > 0 ? data.numbers.join(' + ') : '';
            totalSum.textContent = data.sum;
        }

        // Initialize UI with previously persisted data on page load
        updateUI(manageNumbersAndSummarize('GET'));
    
        addButton.addEventListener('click', function () {
            const number = numberInput.value.trim();

            // Check if input is a valid integer (no decimals, no empty input)
            if (!/^-?\d+$/.test(number)) { 
                alert('Please enter a valid integer.');
                return;
            }

            const numValue = parseInt(number, 10);
            
            // Execute the single unified function
            const updatedData = manageNumbersAndSummarize('ADD', numValue);
            
            // Update the display
            updateUI(updatedData);

            numberInput.value = '';
            numberInput.focus();
        });
    </script>
</body>
</html>
