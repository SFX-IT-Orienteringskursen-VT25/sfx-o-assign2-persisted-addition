<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add and Summarize Numbers</title>
</head>
<body>
    <div class="container">
        <h1>Add a Number and Summarize Them</h1>
        <p>Enter a number below. The calculator will correctly summarize the numbers.</p>
        <p><strong>Bonus improvement:</strong> Prevents adding invalid inputs.</p>
        
        <input type="text" id="numberInput" placeholder="Enter an integer">
        <button id="addButton">Add Number</button>
        
        <div class="list">
            <div id="numberList"></div>
            =
            <h3><span id="totalSum">0</span></h3>
        </div>
    </div>

    <script>
        // Pass a list to update what is saved. Call it with no list to retrieve what is saved.
        // Only the list is stored. The sum is calculated from that list and is not saved.
        function retrieveOrUpdateNumbers(numbers) {
            if (numbers !== undefined) {
                localStorage.setItem('enteredNumbers', JSON.stringify(numbers));
            }

            // Nothing saved yet means the user has not added a number.
            let savedText = localStorage.getItem('enteredNumbers');
            let enteredNumbers = [];
            if (savedText) {
                enteredNumbers = JSON.parse(savedText);
            }

            let sum = 0;
            for (let i = 0; i < enteredNumbers.length; i++) {
                sum = sum + enteredNumbers[i];
            }

            return { enteredNumbers: enteredNumbers, sum: sum };
        }

        const numberInput = document.getElementById('numberInput');
        const addButton = document.getElementById('addButton');
        const numberList = document.getElementById('numberList');
        const totalSum = document.getElementById('totalSum');

        // Retrieve the saved list and show the sum calculated from it.
        let result = retrieveOrUpdateNumbers();
        let enteredNumbers = result.enteredNumbers;
        numberList.textContent = enteredNumbers.join(' + ');
        totalSum.textContent = result.sum;
    
        addButton.addEventListener('click', function () {
            const number = numberInput.value.trim();

            // Check if input is a valid integer (no decimals, no empty input)
            if (!/^-?\d+$/.test(number)) { 
                alert('Please enter a valid integer.');
                return;
            }

            const numValue = parseInt(number, 10);
            enteredNumbers.push(numValue);

            // Update the saved list, then show the sum calculated from it.
            result = retrieveOrUpdateNumbers(enteredNumbers);
            numberList.textContent = enteredNumbers.join(' + ');
            totalSum.textContent = result.sum;

            numberInput.value = '';
            numberInput.focus();
        });
    </script>
</body>
</html>
