<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add and Summarize Numbers</title>
</head>
<body>
    <div class="container">
        <h1>Add a Number and Summarize Them</h1>
        <p>Enter a number below. The calculator will correctly summarize the numbers.</p>
        <p><strong>Bonus improvement:</strong> Prevents adding invalid inputs.</p>
        
        <input type="text" id="numberInput" placeholder="Enter an integer" />
        <button id="addButton" onclick="addNumber()">Add Number</button>

        <div id="adding"></div>
        
        <div class="list">
            <div id="numberList"></div>
            =
            <h3><span id="totalSum">0</span></h3>
        </div>
    </div>

    <script src="add.js"></script>

    <script>
        function addNumber() {
        const input = document.getElementById('numberInput');
        
        const result = addNumberLogic(localStorage, input.value);

        if (result.error === 'invalid') {
            alert('Please enter a valid integer.');
            return;
        }

        
        document.getElementById('numberList').textContent = result.numbers.join(' + ');
        document.getElementById('totalSum').textContent = result.sum;
        document.getElementById('adding').innerText = `You added: ${input.value}`;
        
        input.value = '';
        input.focus();
        }


        window.onload = function() {

        const result = addNumberLogic(localStorage, ""); 

        if (result.numbers) {
            document.getElementById('numberList').textContent = result.numbers.join(' + ');
            document.getElementById('totalSum').textContent = result.sum;
        }
        };
    
    </script>
</body>
</html>
