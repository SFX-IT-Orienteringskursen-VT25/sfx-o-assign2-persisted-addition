<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add and Summarize Numbers</title>
</head>
<body>
    <div class="container">
        <h1>Add a Number and Summarize Them</h1>
        <p>Enter a number below. The calculator will correctly summarize the numbers.</p>
        <p><strong>Bonus improvement:</strong> Prevents adding invalid inputs.</p>
        
        <input type="text" id="numberInput" placeholder="Enter an integer">
        <button id="addButton">Add Number</button>
        <button id="clearMemory"onclick="localStorage.removeItem('persistedAddition.enteredNumbers'); location.reload();" >Clear Memory</button>
        
        <div class="list">
            <div id="numberList"></div>
            =
            <h3><span id="totalSum">0</span></h3>
        </div>
    </div>

    <script>
        const LS_KEY = 'persistedAddition.enteredNumbers';

        const numberInput = document.getElementById('numberInput');
        const addButton = document.getElementById('addButton');
        const numberList = document.getElementById('numberList');
        const totalSum = document.getElementById('totalSum');
    
        let enteredNumbers = [];
        let sum = 0;

        function updateUI() {
            numberList.textContent = enteredNumbers.length ? enteredNumbers.join(' + ') : '';
            totalSum.textContent = sum;
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem(LS_KEY, JSON.stringify(enteredNumbers));
            } catch (e) {
                console.warn('Could not save to localStorage', e);
            }
        }

        // Load persisted numbers on page load
        (function loadFromLocalStorage() {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        // Ensure values are numbers
                        enteredNumbers = parsed.map(n => Number(n)).filter(n => !Number.isNaN(n));
                        sum = enteredNumbers.reduce((a, b) => a + b, 0);
                    }
                }
            } catch (e) {
                console.warn('Could not read from localStorage', e);
            }
            updateUI();
        })();

        addButton.addEventListener('click', function () {
            const number = numberInput.value.trim();

            // Check if input is a valid integer (no decimals, no empty input)
            if (!/^-?\d+$/.test(number)) { 
                alert('Please enter a valid integer.');
                return;
            }

            const numValue = parseInt(number, 10);
            enteredNumbers.push(numValue);
            sum += numValue;

            updateUI();
            saveToLocalStorage();

            numberInput.value = '';
            numberInput.focus();
        });
    </script>
</body>
</html>
