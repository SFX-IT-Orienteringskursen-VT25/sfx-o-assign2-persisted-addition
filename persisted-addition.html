<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add and Summarize Numbers</title>
</head>

<body>
    <div class="container">
        <h1>Add a Number and Summarize Them</h1>
        <p>Enter a number below. The calculator will correctly summarize the numbers.</p>
        <p><strong>Bonus improvement:</strong> Prevents adding invalid inputs.</p>

        <input type="text" id="numberInput" placeholder="Enter an integer">
        <button id="addButton">Add Number</button>

        <div class="list">
            <div id="numberList"></div>
            =
            <h3><span id="totalSum">0</span></h3>
        </div>
    </div>

    <script type="module">
        // Importing the AddNumbers class from addNumbers.js
        import { AddNumbers } from './addNumbers.js';
        const addNumbers = new AddNumbers();



        const numberInput = document.getElementById('numberInput');
        const addButton = document.getElementById('addButton');
        const numberList = document.getElementById('numberList');
        const totalSum = document.getElementById('totalSum');


        let enteredNumbers = [];
        let sum = 0;

        //Reading persisted numbers from localStorage on page load
        let persistentNumbers = localStorage.getItem('enteredNumbers');
        if (persistentNumbers) {
            enteredNumbers = persistentNumbers.split(',').map(Number);
            sum = enteredNumbers.reduce((acc, curr) => addNumbers.add(curr, acc), 0);
            numberList.textContent = enteredNumbers.join(' + ');
            totalSum.textContent = sum;
        }
        addButton.addEventListener('click', function () {

            const number = numberInput.value.trim();

            // Check if input is a valid integer (no decimals, no empty input)
            if (!/^-?\d+$/.test(number)) {
                alert('Please enter a valid integer.');
                return;
            }

            const numValue = parseInt(number, 10);
            enteredNumbers.push(numValue);
            
            // Using the add method from AddNumbers class to calculate the sum
            sum = addNumbers.add(numValue, sum);

            // Persisting the entered numbers in localStorage
            localStorage.setItem('enteredNumbers', enteredNumbers);

            numberList.textContent = enteredNumbers.join(' + ');
            totalSum.textContent = sum;

            numberInput.value = '';
            numberInput.focus();
        });
    </script>
</body>

</html>
