<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add and Summarize Numbers</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">
        <h1>Number Calculator</h1>

        <p>Enter numbers to calculate the total.</p>

        <input type="number" id="numberInput" placeholder="Enter a number">
        <button onclick="addNumber()">Add Number</button>
		<button onclick="clearNumbers()" class="clear">Reset</button>

        <div class="result">
            <p id="numberList"></p>
            <h2>= <span id="totalSum">0</span></h2>
        </div>
    </div>

    <script>

        window.onload = function() {
            calculateNumbers();
        };

        function addNumber() {
            const number = document.getElementById('numberInput').value;

            if (number) {
                calculateNumbers(number);
                document.getElementById('numberInput').value = '';
            } else {
                alert('Please enter a number!');
            }
        }


        function calculateNumbers(newNumber) {
            let savedNumbers = localStorage.getItem('numbers');

            if (!savedNumbers) {
                savedNumbers = '';
            }

            if (newNumber) {
                if (savedNumbers) {
                    savedNumbers = savedNumbers + ',' + newNumber;
                } else {
                    savedNumbers = newNumber;
                }
                localStorage.setItem('numbers', savedNumbers);
            }

            let numbers = savedNumbers.split(',');
            let sum = 0;

            for (let i = 0; i < numbers.length; i++) {
                if (numbers[i]) {
                    sum = sum + Number(numbers[i]);
                }
            }

            document.getElementById('numberList').innerText =
                numbers.filter(number => number).join(' + ');

            document.getElementById('totalSum').innerText = sum;
        }
		
		function clearNumbers() {
            localStorage.removeItem('numbers');
            document.getElementById('numberList').innerText = '';
            document.getElementById('totalSum').innerText = '0';
            document.getElementById('numberInput').value = '';
        }
    </script>
</body>
</html>
