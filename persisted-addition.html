<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add and Summarize Numbers</title>
</head>
<body>
    <div class="container">
        <h1>Add a Number and Summarize Them</h1>
        <p>Enter a number below. The calculator will correctly summarize the numbers.</p>
        <p><strong>Bonus improvement:</strong> Prevents adding invalid inputs.</p>
        
        <input type="text" id="numberInput" placeholder="Enter an integer">
        <button id="addButton">Add Number</button>
        <button id="resetButton">Reset Sum</button>
        
        <div class="list">
            <div id="numberList"></div>
            =
            <h3><span id="totalSum">0</span></h3>
        </div>
    </div>

    <script>
        const numberInput = document.getElementById('numberInput');
        const addButton = document.getElementById('addButton');
        const resetButton = document.getElementById('resetButton');
        const numberList = document.getElementById('numberList');
        const totalSum = document.getElementById('totalSum');
    
        let enteredNumbers = [];
        let sum = 0;

        //loading numbers from localStorage
        const stored = localStorage.getItem('numbers');
        if(stored)
        {
            enteredNumbers = JSON.parse(stored);
            sum = enteredNumbers.reduce((a,b)=>a+b,0);
            totalSum.textContent = sum;
            numberList.textContent = '';
        }
        //function for sum&add number
        function addNumber(num)
        {
            enteredNumbers.push(num);
            sum = enteredNumbers.reduce((a,b)=>a+b,0);
            localStorage.setItem('numbers',JSON.stringify(enteredNumbers));
            numberList.textContent = enteredNumbers.join(' + ');
            totalSum.textContent = sum;
        }

        addButton.addEventListener('click', function () {
            const number = numberInput.value.trim();

            // Check if input is a valid integer (no decimals, no empty input)
            if (!/^-?\d+$/.test(number)) { 
                alert('Please enter a valid integer.');
                return;
            }

        resetButton.addEventListener('click',function(){
            enteredNumbers=[];
            sum = 0;
            localStorage.removeItem('numbers');

            numberList.textContent='';
            totalSum.textContent = sum;
        });

            addNumber(parseInt(number,10));

            numberInput.value = '';
            numberInput.focus();
        });
    </script>
</body>
</html>
