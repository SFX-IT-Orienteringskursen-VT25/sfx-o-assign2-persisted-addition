<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add and Summarize Numbers</title>
</head>
<body>
    <div class="container">
        <h1>Add a Number and Summarize Them</h1>
        <p>Enter a number below. The calculator will correctly summarize the numbers.</p>
        <p><strong>Bonus improvement:</strong> Prevents adding invalid inputs.</p>
        
        <input type="text" id="numberInput" placeholder="Enter an integer">
        <button id="addButton">Add Number</button>
        
        <div class="list">
            <div id="numberList"></div>
            =
            <h3><span id="totalSum">0</span></h3>
        </div>
    </div>

    <script>

        const numberInput = document.getElementById('numberInput');
	const addButton = document.getElementById('addButton');
	const numberList = document.getElementById('numberList');
	const totalSum = document.getElementById('totalSum');

function persistNumbers(numbers) {
    localStorage.setItem('enteredNumbers', JSON.stringify(numbers));

    const savedNumbers = JSON.parse(localStorage.getItem('enteredNumbers')) || [];

    numberList.textContent = savedNumbers.join(' + ');

    const sum = savedNumbers.reduce((total, number) => total + number, 0);
    totalSum.textContent = sum;

    return sum;
}

addButton.addEventListener('click', function () {
    const number = numberInput.value.trim();

    // Check if input is a valid integer
    if (!/^-?\d+$/.test(number)) {
        alert('Please enter a valid integer.');
        return;
    }

    const numValue = parseInt(number, 10);

    const enteredNumbers =
        JSON.parse(localStorage.getItem('enteredNumbers')) || [];

    enteredNumbers.push(numValue);

    persistNumbers(enteredNumbers);

    numberInput.value = '';
    numberInput.focus();
});

// Load persisted numbers when the page starts
const savedNumbers =
    JSON.parse(localStorage.getItem('enteredNumbers')) || [];

persistNumbers(savedNumbers);

    </script>
</body>
</html>
