<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Numbers and add them</title>
</head>
<body>
    <div class="container">
        <h1>Get Numbers and add them</h1>
        <p>Enter a number below.</p>
        <p><strong>Prevents adding invalid inputs.</strong> </p>
        
        <input type="text" id="numberInput" placeholder="Enter an integer">
        <button id="addButton">Enter Number</button>
        
        <div class="list">
            <div id="numberList"></div>
            =
            <h3><span id="totalSum">0</span></h3>
        </div>
    </div>

    <script>
        const numberInput = document.getElementById('numberInput');
        const addButton = document.getElementById('addButton');
        const numberList = document.getElementById('numberList');
        const totalSum = document.getElementById('totalSum');
    
        let enteredNumbers = [];
        let sum = 0;
    
        addButton.addEventListener('click', function () {
            const number = numberInput.value.trim();

            // Check if input is a valid integer (no decimals, no empty input)
            if (!/^-?\d+$/.test(number)) { 
                alert('Please enter a valid integer.');
                return;
            }

            const numValue = parseInt(number, 10);
            enteredNumbers.push(numValue);
            sum += numValue;

            numberList.textContent = enteredNumbers.join(' + ');
            totalSum.textContent = sum;

            numberInput.value = '';
            numberInput.focus();
        });
    </script>
</body>
</html>
