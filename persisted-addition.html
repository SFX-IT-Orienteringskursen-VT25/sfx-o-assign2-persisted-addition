<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add and Summarize Numbers</title>
</head>
<body>
    <div class="container">
        <h1>Add a Number and Summarize Them</h1>
        <p>Enter a number below. The calculator will correctly summarize the numbers.</p>
        <p><strong>Bonus improvement:</strong> Prevents adding invalid inputs.</p>
        
        <input type="text" id="numberInput" placeholder="Enter an integer">
        <button id="addButton">Add Number</button>
        <button id="resetButton">Reset</button>
        <div class="list">
            <div id="numberList"></div>
            =
            <h3><span id="totalSum">0</span></h3>
        </div>
    </div>

    <script>
        const numberInput = document.getElementById('numberInput');
        const addButton = document.getElementById('addButton');
        const resetButton = document.getElementById('resetButton');
        const numberList = document.getElementById('numberList');
        const totalSum = document.getElementById('totalSum');
        
        let enteredNumbers = [];
        let sum = 0;
        window.onload = function() {
            sum = updateCalculator();
            renderCalculator(sum);
        };
    
        addButton.addEventListener('click', function () {
            const number = numberInput.value.trim();

            // Check if input is a valid integer (no decimals, no empty input)
            if (!/^-?\d+$/.test(number)) { 
                alert('Please enter a valid integer.');
                return;
            }

            const numValue = parseInt(number, 10);
            sum = updateCalculator(numValue);
            renderCalculator(sum);

            numberInput.value = '';
            numberInput.focus();
        });
        resetButton.addEventListener('click', function () {
            localStorage.removeItem('savedEnteredNumbers');
            
            enteredNumbers = [];
            sum = 0;
            renderCalculator(sum);  
        });
        function updateCalculator(newNumber) {
            // 1. Handle reading/writing the persisted numbers
            const savedEnteredNumbers = localStorage.getItem('savedEnteredNumbers');

            if (savedEnteredNumbers) {
                enteredNumbers = JSON.parse(savedEnteredNumbers);
            }
            // 2. If a new number was provided, is added to the array.
            if (newNumber !== undefined) {
                enteredNumbers.push(newNumber);
                localStorage.setItem('savedEnteredNumbers', JSON.stringify(enteredNumbers));
            }

            // 3. Calculate the sum of the numbers
            let sumOfNumbers = 0;
            for (const num of enteredNumbers) {
                sumOfNumbers += num;
            }  
            // 4. Return the calculated sum
            return sumOfNumbers;
        }
        function renderCalculator(sum) {
            // 1. Render the list of numbers
            numberList.textContent = enteredNumbers.join(' + ');

            // 2. Render the total sum
            totalSum.textContent = sum;
        }
    </script>
</body>
</html>
